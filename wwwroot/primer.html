<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вводный тренажёр по API</title><style>* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --space: #0b2630;
  --deep: #103641;
  --ink: #142e34;
  --muted: #485e5b;
  --paper: #f3f5ed;
  --card: #fcfdf8;
  --line: #d5dfd2;
  --mint: #bce8bc;
  --gold: #f0ca86;
  --error: #8b352d;
  --width: 1260px;
  font: 16px/1.55 "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
body { margin: 0; }
a { color: inherit; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .66; }
:focus-visible { outline: 3px solid #c27e26; outline-offset: 4px; }
.skip { position: absolute; left: 12px; top: -80px; z-index: 9; padding: 10px 18px; background: white; }
.skip:focus { top: 12px; }
.site-header, .hero, .station-nav, main, footer { width: min(calc(100% - 60px), var(--width)); margin-inline: auto; }
.site-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 78px; }
.site-header nav { display: flex; flex-wrap: wrap; gap: 7px 22px; }
.site-header nav a { padding-block: 7px; text-decoration: none; border-bottom: 2px solid transparent; color: var(--muted); }
.site-header nav a[aria-current="page"] { border-color: #498163; color: var(--ink); font-weight: 700; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 750; white-space: nowrap; }
.logo { display: inline-grid; place-items: center; background: var(--space); color: var(--mint); width: 36px; height: 36px; border-radius: 50%; font-size: 25px; }
.hero { position: relative; display: grid; grid-template-columns: 1fr 1.13fr; overflow: hidden; min-height: 368px; border-radius: 27px 27px 27px 5px; background: var(--space); color: #eef6e9; }
.hero-copy { padding: clamp(26px, 4.4vw, 61px); z-index: 1; align-self: center; }
.signal { display: flex; align-items: center; gap: 10px; color: #c1d8c9; margin: 0 0 16px; font-size: .88rem; }
.signal span { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px #bce8bc26; }
h1, h2, h3, .score strong { font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif; }
h1 { margin: 0; font-size: clamp(2.55rem, 5vw, 4.9rem); line-height: .99; letter-spacing: -.045em; font-weight: 680; }
h1 span { color: var(--gold); }
.hero-copy > p:not(.signal) { margin-block: 19px 25px; max-width: 37ch; color: #c7ddda; }
.hero-actions, .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.button { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; min-height: 43px; border: 1px solid var(--line); border-radius: 7px; text-decoration: none; font-weight: 700; background: var(--card); color: var(--ink); line-height: 1.3; text-align: center; }
.button:hover { background: #e5eee1; }
.button.primary { background: var(--mint); color: #132f2c; border-color: #a3cda3; }
.button.primary:hover { background: #d8f3cb; }
.button.ghost { color: #eef6e9; background: transparent; border-color: #66858a; }
.button.ghost:hover { background: #214650; }
.star-map { position: relative; min-height: 270px; }
.orbit-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-node { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid #bce8bc9e; color: #f4faea; background: #153b43; font: 700 .9rem Bahnschrift, sans-serif; text-decoration: none; box-shadow: 0 0 0 4px #153b4380; }
.map-node:hover, .map-node[aria-current="step"] { color: var(--space); background: var(--gold); border-color: var(--gold); }
.map-node.done { background: var(--mint); color: var(--space); }
.map-caption { display: flex; justify-content: space-between; gap: 10px; position: absolute; bottom: 0; padding: 10px 18px; color: #e3f0e3; background: #09242bcf; width: 100%; font-size: .81rem; }
.station-nav { display: grid; grid-template-columns: repeat(8, minmax(0,1fr)); gap: 6px; margin-block: 17px 26px; }
.station-nav a { display: grid; grid-template-columns: 24px auto; gap: 7px; align-items: center; min-height: 48px; padding: 7px 8px; text-decoration: none; border-bottom: 2px solid var(--line); font-size: .84rem; color: var(--muted); }
.station-nav a:hover, .station-nav a[aria-current="step"] { border-color: #437c61; color: var(--ink); background: #e4eddf; }
.station-nav .number { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e2e8dc; font-weight: 700; color: var(--ink); }
.station-nav .done .number { background: var(--mint); }
main { margin-bottom: 48px; min-height: 300px; }
.workspace, .sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .89fr); gap: 18px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: clamp(17px, 2.8vw, 33px); min-width: 0; }
.panel > :first-child, .reference > :first-child { margin-top: 0; }
.kicker { color: #396e55; font-size: .9rem; margin: 0 0 7px; font-weight: 700; }
h2 { font-size: clamp(1.75rem, 3.4vw, 2.95rem); margin: 0 0 12px; line-height: 1.12; letter-spacing: -.032em; overflow-wrap: anywhere; }
h3 { font-size: 1.2rem; margin: 21px 0 7px; line-height: 1.2; }
p { margin: 0 0 12px; }
.brief { border-left: 4px solid #619279; padding: 12px 15px; background: #eaf1e7; margin-block: 19px; }
.brief strong { display: block; }
.steps { padding-left: 23px; margin: 7px 0 16px; }
.steps li + li { margin-top: 6px; }
.note { color: var(--muted); }
.draft-label { display: block; margin-top: 17px; font-weight: 700; }
#draft { display: block; width: 100%; margin: 5px 0; padding: 9px; resize: vertical; border: 1px solid #729087; border-radius: 6px; color: var(--ink); background: white; }
.draft-preview { margin-bottom: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.example { border-left: 3px solid #b58a48; background: #faf2e0; padding: 10px 13px; }
.station-explanation summary { cursor: pointer; margin-bottom: 7px; }
.brief p { margin: 9px 0 0; }
.worksheet-panel { margin-top: 18px; }
.worksheet + .worksheet { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 8px; }
.worksheet table { min-width: 600px; }
.worksheet td { padding: 6px; }
.worksheet textarea, .primer-json textarea { width: 100%; min-width: 105px; color: var(--ink); background: white; border: 1px solid #789288; border-radius: 5px; padding: 7px; resize: vertical; }
.text-button { border: 0; padding: 0; color: #285b48; background: none; text-decoration: underline; }
.case-selector { margin-block: 4px 18px; background: #e4eddf; padding: 13px 16px; border-radius: 10px; }
.case-selector .note { margin: 8px 0 0; }
.primer { width: 100%; }
.primer-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
.primer-tabs [aria-pressed="true"], #primer-variants [aria-pressed="true"] { background: var(--mint); border-color: #5d9272; }
.primer-visual { margin: 12px 0; padding: clamp(12px, 2.5vw, 25px); border: 1px solid #31585b; border-radius: 11px; background: var(--space); color: #edf5e9; }
.primer-visual p { color: #d4e5de; }
.primer-visual pre { background: #153943; margin: 9px 0 0; }
.primer-flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0; }
.primer-flow li { min-height: 53px; display: grid; place-items: center; position: relative; text-align: center; border: 1px solid #648382; border-radius: 7px; padding: 7px; font-size: .9rem; overflow-wrap: anywhere; }
.primer-flow .flow-active { background: var(--mint); color: var(--ink); font-weight: 700; }
.primer-flow .flow-blocked { border-style: dashed; color: #b9c8c7; }
.primer-flow .flow-blocked small { font-size: .77rem; }
.primer-flow:not(.primer-structure) .flow-active::after { content: ""; position: absolute; height: 4px; width: 34%; bottom: 5px; left: 33%; border-radius: 4px; background: #267057; animation: packet 420ms ease-out both; }
.primer-flow li:not(:last-child)::before { content: "›"; position: absolute; right: -10px; color: #bce8bc; z-index: 1; font-size: 19px; }
.primer-structure li:not(:last-child)::before { content: "·"; }
.relation-strip { margin: 8px 0 0; font-size: .85rem; }
@keyframes packet { from { opacity: 0; transform: translateX(-70%); } to { opacity: 1; transform: translateX(0); } }
.primer-paused .flow-active::after, .primer-paused .stock-track > * { animation-play-state: paused !important; }
.primer-stock { display: grid; gap: 8px; max-width: 640px; }
.stock-legend { display: flex; gap: 16px; margin: 0; font-size: .85rem; }
.stock-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 2px; background: var(--mint); }
.stock-legend span:first-child::before { background: var(--gold); }
.stock-track { display: flex; height: 13px; background: #284951; border-radius: 8px; overflow: hidden; }
.stock-track > * { width: var(--share); transform-origin: left; animation: stock-fill 420ms ease-out both; }
.stock-track i { background: var(--gold); }
.stock-track b { background: var(--mint); }
@keyframes stock-fill { from { opacity: .55; } to { opacity: 1; } }
.primer-json { display: grid; max-width: 590px; gap: 7px; justify-items: start; margin: 10px 0; }
.primer-json textarea { font-family: Consolas, monospace; }
@media (prefers-reduced-motion: reduce) {
  .primer-flow .flow-active::after, .stock-track > * { animation: none !important; }
}
.section-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.section-heading h2 { margin-bottom: 0; }
.challenge { border: 0; padding: 0; margin: 18px 0 22px; min-inline-size: 0; }
.challenge legend { padding: 0; font-weight: 700; margin-bottom: 9px; }
.choice { display: block; width: 100%; text-align: left; padding: 9px 11px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 6px; background: #f1f5ed; color: var(--ink); }
.choice:hover { border-color: #588870; }
.choice[data-selected="true"] { border-color: #ad6f2e; background: #fbefd7; }
.choice[data-correct="true"] { border-color: #629779; background: #def0dc; }
.feedback { min-height: 26px; color: var(--muted); margin-block: 6px 0; }
.feedback.error, .error { color: var(--error); }
.numeric { display: flex; flex-wrap: wrap; align-items: end; gap: 7px; }
.numeric label { display: grid; color: var(--muted); font-size: .9rem; }
input[type="number"] { width: 130px; padding: 8px; border: 1px solid #729087; border-radius: 5px; background: white; color: var(--ink); }
.progress-track { height: 7px; border-radius: 6px; overflow: hidden; background: #e2eadf; margin-bottom: 14px; }
.progress-track span { height: 100%; display: block; width: var(--progress); background: #548a6c; }
.table-wrap { overflow-x: auto; margin-bottom: 15px; }
table { border-collapse: collapse; text-align: left; width: 100%; font-size: .94rem; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
th { background: #e8efe4; font-weight: 750; }
td { overflow-wrap: anywhere; }
.score { display: flex; justify-content: space-between; align-items: center; border-radius: 11px; background: var(--deep); color: #f2f8ed; padding: 12px 15px; margin-bottom: 12px; }
.score strong { font-size: 2.15rem; color: var(--gold); line-height: 1; }
.missions { margin: 14px 0; }
.mission { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 13px; border-top: 1px solid var(--line); padding: 13px 0; }
.mission h3 { margin: 0; }
.mission p { margin-bottom: 3px; }
.mission-id { color: #3b7158; margin-right: 6px; font-size: .83rem; font-weight: 700; }
.phase { display: inline-flex; gap: 6px; align-items: center; background: #e4efdf; border-radius: 20px; padding: 4px 10px; font-size: .84rem; }
.phases { display: flex; flex-wrap: wrap; gap: 5px; padding: 0; margin: 10px 0 15px; list-style: none; }
.phases .current { font-weight: 700; background: var(--mint); }
.history { display: grid; gap: 7px; border-left: 2px solid #73a789; padding-left: 15px; margin: 12px 0; list-style: none; }
.history time { color: var(--muted); font-size: .86rem; margin-left: 5px; }
pre { overflow: auto; background: #102f39; color: #e9f5e8; border-radius: 8px; padding: 12px; font-size: .84rem; max-height: 340px; white-space: pre-wrap; overflow-wrap: anywhere; }
code { overflow-wrap: anywhere; }
.log { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.log button { border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; background: #eef4eb; color: var(--ink); font-size: .85rem; }
.log button[aria-pressed="true"] { border-color: #478463; background: var(--mint); }
[data-objective][aria-pressed="true"] { border-color: #478463; background: var(--mint); }
.reference { max-width: 1050px; }
.document header, .document article { max-width: 1020px; margin-inline: auto; }
.document header { margin-block: 28px 18px; }
.document article { margin-bottom: 36px; }
.document h1 { font-size: clamp(2rem, 5vw, 3.8rem); }
.document section + section { margin-top: 33px; border-top: 1px solid var(--line); padding-top: 25px; }
.document nav { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 15px; }
.document .panel { width: min(calc(100% - 24px), 1020px); }
.document > header { width: min(calc(100% - 24px), 1020px); }
.diagram { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; }
.diagram span { border: 1px solid #a7bba9; background: #eaf3e7; border-radius: 6px; padding: 6px 9px; }
footer { border-top: 1px solid var(--line); padding-block: 16px 27px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .87rem; }
@media (max-width: 1050px) { .station-nav { grid-template-columns: repeat(4, minmax(0,1fr)); } }
@media (max-width: 800px) {
  .site-header, .hero, .station-nav, main, footer { width: calc(100% - 32px); }
  .site-header { padding-block: 12px; flex-wrap: wrap; gap: 6px; }
  .site-header nav { gap: 5px 13px; font-size: .87rem; }
  .hero { grid-template-columns: 1fr 1fr; }
  .hero-copy { padding: 25px 20px; }
  .workspace, .sim-grid { grid-template-columns: 1fr; }
}
@media (max-width: 580px) {
  .hero { grid-template-columns: 1fr; border-radius: 19px 19px 19px 4px; }
  .hero-copy { padding: 25px 19px 19px; }
  .star-map { min-height: 236px; }
  .station-nav { grid-template-columns: repeat(2, minmax(0,1fr)); margin-bottom: 19px; }
  .mission { grid-template-columns: 1fr; }
  .mission button { justify-self: start; }
  .map-node { width: 28px; height: 28px; }
}
@media print {
  .document { background: white; }
  .document nav { display: none; }
  .document .panel { padding: 0; border: 0; width: 100%; }
  .document section { break-inside: auto; }
  .document tr { break-inside: avoid; }
  .table-wrap { overflow: visible; }
}

/* The application and its in-context lessons share one palette. */
.outpost-app {
  --sim-bg: #0a1820;
  --sim-panel: #142b36;
  --sim-ink: #ecf6f3;
  --sim-muted: #b7cdcf;
  --sim-line: #3b5963;
  --sim-mint: #a4efca;
  --ink: var(--sim-ink);
  --muted: var(--sim-muted);
  --paper: var(--sim-bg);
  --card: var(--sim-panel);
  --line: var(--sim-line);
  --mint: var(--sim-mint);
  --error: #ffd0ad;
  --width: 1110px;
  min-height: 100vh;
  background: radial-gradient(ellipse at 92% 0%, #12333c 0, var(--sim-bg) 55%);
  color: var(--ink);
}
.outpost-app main:focus, .outpost-app #worksheets:focus, .outpost-app #sim-message:focus { outline: none; }
.outpost-app .site-header { min-height: 65px; }
.outpost-app .site-header nav a[aria-current="page"] { border-color: var(--mint); color: var(--mint); }
.outpost-app .logo { border: 1px solid var(--line); }
.outpost-app .skip { background: var(--card); }
.outpost-app .kicker, .outpost-app .signal { color: var(--mint); }
.outpost-app .button { color: var(--ink); background: #1c3743; border-color: #55727e; }
.outpost-app .button:hover { background: #294b57; }
.outpost-app .button.primary { color: #102a22; background: var(--mint); border-color: var(--mint); }
.outpost-app .button.primary:hover { background: #c3f7db; }
.outpost-app .button.ghost { background: transparent; }
.outpost-app .text-button { color: var(--mint); }
.outpost-app th { color: var(--ink); background: #213d49; }
.outpost-app .choice, .outpost-app .diagram span { background: #10232d; border-color: var(--line); }
.outpost-app .choice:hover { border-color: var(--mint); }
.outpost-app .choice[data-correct="true"] { background: #1f4844; border-color: var(--mint); }
.outpost-app .choice[data-selected="true"] { background: #41332b; border-color: var(--gold); }
.outpost-app input[type="number"], .outpost-app textarea, .outpost-app select {
  background: #0c202b; color: var(--ink); border-color: #5e7b83;
}
.outpost-app .brief, .outpost-app .example { background: #0e222c; color: var(--ink); }
.outpost-app .progress-track { background: #28434d; }
.outpost-app .progress-track span { background: var(--mint); }
.outpost-app .station-nav a:hover, .outpost-app .station-nav a[aria-current="step"] {
  color: var(--mint); background: #1b3945; border-color: var(--mint);
}
.outpost-app .station-nav .number { background: #28434d; color: var(--ink); }
.outpost-app .station-nav .done .number { background: var(--mint); color: #102a22; }
.outpost-app .map-note { color: var(--muted); padding-top: 16px; }
.simulator-mode .hero, .simulator-mode .station-nav, .station-mode .hero, .project-map-mode .station-nav { display: none; }
.station-mode .station-nav { margin-top: 4px; }
.station-workspace h1, .reference h1 { font-size: clamp(1.85rem,4.5vw,3rem); margin-bottom: 12px; }
.station-section { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 16px; }
.station-section h2 { font-size: clamp(1.25rem,3vw,1.65rem); }
.station-section .primer { padding: 15px 0 0; border: 0; }
.station-draft { margin-top: 18px; }
.station-section .challenge { max-width: 730px; }
.dossier-source { border-top: 1px solid var(--line); padding: 10px 0 3px; }
.dossier-source h4 { margin: 0 0 4px; }
.dossier-source:target { border-color: var(--mint); }
.lab-http-guide { margin-block: 1rem; }
.lab-http-guide summary { font-weight: 700; }
.worked-example { border-left: 2px solid var(--line); padding: 6px 12px; margin: 0 0 14px; }
.worked-example summary { font-weight: 700; cursor: pointer; }
.worked-example dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 6px 12px; }
.worked-example dt { font-weight: 700; }
.worked-example dd { margin: 0; overflow-wrap: anywhere; }
.mobile-cell-label { display: none; }
@media screen and (max-width: 760px) {
  .worked-example dl { display: block; }
  .worked-example dd { margin-bottom: 6px; }
  .worksheet-table { overflow: visible; }
  .worksheet-table table, .worksheet-table tbody, .worksheet-table tr, .worksheet-table td { display: block; width: 100%; }
  .worksheet .worksheet-table table { min-width: 0; }
  .worksheet-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .worksheet-table tbody tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; padding: 7px 10px; }
  .worksheet-table tbody td { border: 0; padding: 6px 0; overflow-wrap: anywhere; }
  .worksheet-table .mobile-cell-label { display: block; font-size: .85rem; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .worksheet-table textarea { min-width: 0; }
}

.sim-shell {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: clamp(16px, 3.6vw, 37px);
}
.sim-heading {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--line);
  padding-bottom: 11px;
  margin-bottom: 16px;
}
.sim-heading p { margin: 0; font-weight: 700; font-size: .95rem; color: var(--mint); }
.sim-eyebrow { margin-bottom: 7px; color: var(--mint); font-size: .87rem; font-weight: 650; }
.sim-status { color: var(--mint); font-size: .94rem; margin-bottom: 11px; }
.sim-status:empty { display: none; }
.sim-status-error { color: var(--error); }
.sim-progress { margin: 0 0 18px; }
.sim-progress p { color: var(--muted); margin: 0 0 7px; font-size: .89rem; }
.sim-progress ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.sim-progress li { display: flex; align-items: center; gap: 7px; padding: 7px 8px; margin: 0; color: var(--muted); border-bottom: 2px solid var(--line); font-size: .85rem; line-height: 1.25; }
.sim-progress li span { display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; width: 23px; height: 23px; flex: none; }
.sim-progress [aria-current="step"] { border-color: var(--mint); background: #183b43; color: var(--ink); border-radius: 6px 6px 0 0; }
.sim-progress [aria-current="step"] span { border-color: var(--mint); background: var(--mint); color: #102a22; font-weight: 800; }
.sim-panel { min-width: 0; }
.sim-panel h2 { font-size: clamp(1.55rem,4vw,2.65rem); scroll-margin-top: 20px; }

    return '<div class="primer-stock"><p class="stock-legend"><span>Резерв</span><span>Доступно</span></p>' +
      bar('Топливо', fuel, fuelHeld, 10) + bar('Пайки', rations, rationsHeld, 5) +
      '<p>Баланс — <strong>' + credits + ' кредитов</strong></p></div>';
  }

  window.mountPrimer = function mountPrimer(root, initialChapter = 0, singleChapter = false) {
    let chapter = initialChapter;
    let step = 0;
    let branch = 'ok';
    let playing = false;
    let timer;
    const stepDuration = 5200;
    let remaining = stepDuration;
    let deadline = 0;
    const movement = matchMedia('(prefers-reduced-motion: reduce)');
    let jsonDraft = '{ "action": "start" }';

    root.innerHTML = '<article class="panel primer">' + (singleChapter ? '' : '<div class="section-heading"><div><p class="kicker">Подготовка к маршруту</p>' +
      '<h2>Как устроен прототип API</h2></div><a class="button" href="' +
      (root.hasAttribute('data-standalone-primer') ? 'student-guide.html' : '#map') + '">' +
      (root.hasAttribute('data-standalone-primer') ? 'К заданию' : 'К карте') + '</a></div>' +
      '<p>Разбор привязан к практической работе. После каждого примера указано, что перенести в код или рабочий лист.</p>' +
      '<details class="station-explanation" open><summary>Выбрать тему разбора</summary><nav class="primer-tabs" aria-label="Темы тренажёра">' + slides.map((item, index) =>
        '<button class="button" data-chapter="' + index + '">' + (index + 1) + '. ' + escape(item.title) + '</button>').join('') +
      '</nav></details>') + '<h3 id="primer-title"></h3><p id="primer-intro"></p><p id="primer-purpose" class="note"></p>' +
      '<div id="primer-variants" class="actions"></div>' +
      '<div class="primer-visual" id="primer-frame"></div><div id="primer-json"></div>' +
      '<div class="actions primer-controls"><button class="button" data-player="previous">Назад</button>' +
      '<button class="button ' + (singleChapter ? 'primer-next' : 'primary') + '" data-player="next">Далее</button>' +
      '<button class="text-button" data-player="play">Автопоказ</button>' +
      '<button class="text-button" data-player="restart">Повторить с начала</button>' +
      '<span class="note" id="primer-step" role="status"></span></div></article>';
    const visual = root.querySelector('#primer-frame');
    const stepLabel = root.querySelector('#primer-step');
    const controls = root.querySelector('.primer-controls');

    const current = () => slides[chapter];
    const frames = () => branch === 'fail' && current().failure ? current().failure : current().frames;
    const last = () => frames().length - 1;
    function renderTabs() {
      root.querySelectorAll('[data-chapter]').forEach(item => item.setAttribute('aria-pressed', String(Number(item.dataset.chapter) === chapter)));
      root.querySelector('#primer-title').textContent = current().title;
      root.querySelector('#primer-intro').textContent = current().intro;
      root.querySelector('#primer-purpose').textContent = practiceNotes[chapter][0] + '. ' + practiceNotes[chapter][1];
      root.querySelector('#primer-variants').innerHTML = (current().variants ?? []).map(([key, label]) =>
        '<button class="button" data-branch="' + key + '" aria-pressed="' + (key === branch) + '">' + escape(label) + '</button>').join('');
    }

    function renderControls() {
      controls.querySelector('[data-player="previous"]').hidden = step === 0;
      controls.querySelector('[data-player="next"]').hidden = step === last();
      const play = controls.querySelector('[data-player="play"]');
      play.hidden = step === last() && !playing;
      play.textContent = playing ? 'Пауза' : 'Автопоказ';
      controls.querySelector('[data-player="restart"]').hidden = step !== last();
      stepLabel.textContent = 'Кадр ' + (step + 1) + ' из ' + frames().length;
    }

    function renderFrame() {
      const [heading, detail, snippet, values, special] = frames()[step];
      const active = special ?? (current().direct ? step : step - 1);
      visual.classList.remove('primer-paused');
      visual.innerHTML = '<ol class="primer-flow' + (current().structure ? ' primer-structure' : '') + '" aria-label="Схема">' +
        current().labels.map((label, index) => {
          const blocked = chapter === 5 && branch === 'fail' && step > 0 && [1, 2].includes(index);
          return '<li class="' + (index === active ? 'flow-active' : blocked ? 'flow-blocked' : '') + '"' +
            (index === active ? ' aria-current="step"' : '') + '>' + escape(label) + (blocked ? '<small>пропущен</small>' : '') + '</li>';
        }).join('') + '</ol>' +
        (current().structure ? '<p class="relation-strip"><code>Mission 1 → * Expedition</code> · ' +
          '<code>Expedition 1 → * ExpeditionSupply</code> · <code>Expedition 1 → * ExpeditionStatusEvent</code></p>' : '') +
        '<h3>' + escape(heading) + '</h3><p>' + escape(detail) + '</p>' +
        (values ? inventory(values) : '') + (snippet ? '<pre>' + escape(snippet) + '</pre>' : '');
      const practice = root.querySelector('#primer-json');
      practice.innerHTML = step !== last() ? '' : '<p class="primer-application"><strong>Что сделать в проекте.</strong> ' +
        escape(practiceNotes[chapter][2]) + '</p>' + (chapter === 2
        ? '<form class="primer-json"><label for="json-exercise">Тело POST для запуска E01</label>' +
          '<textarea id="json-exercise" rows="3" spellcheck="false">' + escape(jsonDraft) +
          '</textarea><button class="button primary" type="submit">Проверить JSON</button><p role="status" id="json-result"></p></form>' : '');
      renderControls();
    }

    function pause(keepTime = false) {
      if (timer) {
        clearTimeout(timer);
        timer = undefined;
        if (keepTime) remaining = Math.max(0, deadline - performance.now());
      }
      if (!keepTime) remaining = stepDuration;
      playing = false;
      renderControls();
    }

    function schedule() {
      deadline = performance.now() + remaining;
      timer = setTimeout(() => {
        timer = undefined;
        remaining = stepDuration;
        step++;
        if (step === last()) playing = false;
        renderFrame();
        if (playing) schedule();
      }, remaining);
    }

    function handleClick(event) {
      const target = event.target.closest('button');
      if (!target || !root.contains(target)) return;
      if (target.dataset.chapter !== undefined) {
        pause();
        chapter = Number(target.dataset.chapter);
        step = 0;
        branch = 'ok';
        renderTabs();
        renderFrame();
        return;
      }
      if (target.dataset.branch) {
        pause();
        branch = target.dataset.branch;
        step = 0;
        renderTabs();
        root.querySelector('[data-branch="' + branch + '"]').focus();
        renderFrame();
        return;
      }
      switch (target.dataset.player) {
        case 'previous': pause(); step = Math.max(0, step - 1); renderFrame(); break;
        case 'next': pause(); step = Math.min(last(), step + 1); renderFrame(); break;
        case 'restart': pause(); step = 0; renderFrame(); break;
        case 'play':
          if (playing) {
            pause(true);
            visual.classList.add('primer-paused');
          } else if (step < last()) {
            playing = true;
            visual.classList.remove('primer-paused');
            schedule();
            renderControls();
          }
          break;
      }
    }

    function validateJson(event) {
      if (!event.target.matches('.primer-json')) return;
      event.preventDefault();
      const result = root.querySelector('#json-result');
      jsonDraft = root.querySelector('#json-exercise').value;
      try {
        const json = JSON.parse(jsonDraft);
        if (json === null || Array.isArray(json) || typeof json !== 'object' || typeof json.action !== 'string') {
          result.textContent = 'JSON читается. Обработчику нужен объект со строковым полем action, чтобы заполнить LaunchRequest.Action.';
        } else if (json.action !== 'launch') {
          result.textContent = 'Формат подходит. Команда запуска называется launch. Исправьте значение action, чтобы обработчик принял команду.';
        } else {
          result.textContent = 'Верно. Перенесите это тело в POST в requests.http. При отправке обработчик прочитает launch и проверит статус рейса.';
        }
      } catch {
        result.textContent = 'JSON не читается. Проверьте скобки, двойные кавычки и запятые.';
      }
    }

    const visibility = () => {
      if (document.hidden && playing) {
        pause(true);
        visual.classList.add('primer-paused');
      }
    };
    const rememberJson = event => {
      if (event.target.id === 'json-exercise') jsonDraft = event.target.value;
    };
    if (movement.matches) root.querySelector('[data-player="play"]').title = 'Показ без движения, со сменой смысловых шагов';
    root.addEventListener('click', handleClick);
    root.addEventListener('submit', validateJson);
    root.addEventListener('input', rememberJson);
    document.addEventListener('visibilitychange', visibility);
    renderTabs();
    renderFrame();
    return () => {
      clearTimeout(timer);
      root.removeEventListener('click', handleClick);
      root.removeEventListener('submit', validateJson);
      root.removeEventListener('input', rememberJson);
      document.removeEventListener('visibilitychange', visibility);
    };
  };

  const standalone = document.querySelector('[data-standalone-primer]');
  if (standalone) window.mountPrimer(standalone, location.hash === '#e01' ? 7 : 0);
})();
</script></body></html>
